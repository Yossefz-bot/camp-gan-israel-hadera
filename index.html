<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ניהול אתר הקעמפ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#eef3ff,#f9f7ff);font-family:Arial,sans-serif;color:#17213b}.card{width:min(620px,100%);padding:38px;border:1px solid #dce4f2;border-radius:28px;background:#fff;box-shadow:0 25px 70px rgba(13,25,56,.13)}.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:#edf3ff;color:#2563eb;font-weight:800}.card h1{margin:18px 0 8px;font-size:38px}.card p{color:#65708a;line-height:1.7}.steps{margin:24px 0;padding:0;list-style:none;counter-reset:s}.steps li{counter-increment:s;display:flex;gap:12px;margin:13px 0}.steps li:before{content:counter(s);flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:10px;background:#2563eb;color:#fff;font-weight:900}.button{display:inline-flex;margin-top:10px;padding:13px 20px;border-radius:14px;background:#2563eb;color:#fff;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">שלב ראשון הושלם</span>
    <h1>פאנל הניהול עוד לא מחובר</h1>
    <p>האתר הציבורי מוכן לפריסה ראשונה. בשלב הבא נחבר את D1, ‏R2 והתחברות מנהל מאובטחת — ורק אז פאנל הניהול יאפשר העלאת תמונות, סרטונים ושירים.</p>
    <ol class="steps">
      <li>ליצור מסד D1 בשם <strong>camp-database</strong></li>
      <li>ליצור מאגר R2 בשם <strong>camp-media</strong></li>
      <li>לחבר את שניהם לפרויקט Pages</li>
    </ol>
    <a class="button" href="/">חזרה לאתר</a>
  </main>
</body>
</html>
