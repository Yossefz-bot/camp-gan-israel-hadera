<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול הקעמפ</title><link rel="stylesheet" href="/assets/css/main.css"></head><body class="admin-body"><main class="admin-shell"><header class="admin-head"><div><span class="eyebrow">מערכת ניהול</span><h1>ניהול תוכן הקעמפ</h1></div><a href="/">צפייה באתר</a></header>
<section id="login" class="panel"><h2>כניסת מנהל</h2><p>הזן את קוד הניהול שהוגדר ב־Cloudflare.</p><form id="loginForm"><input id="token" type="password" required placeholder="קוד ניהול"><button>כניסה</button></form><p id="loginStatus"></p></section>
<div id="dashboard" class="hidden"><section class="panel"><h2>יצירת יום חדש</h2><form id="dayForm" class="form-grid"><input name="title" required placeholder="כותרת היום"><input name="slug" required placeholder="כתובת באנגלית, לדוגמה day-1"><input name="date" id="dateInput" type="date" required aria-label="בחירת תאריך"><input id="hebrewDatePreview" type="text" readonly placeholder="התאריך העברי יופיע כאן">
<input name="sort_order" type="number" placeholder="סדר תצוגה"><textarea name="description" placeholder="תיאור קצר"></textarea><button>צור יום</button></form><p id="dayStatus"></p></section>
<section class="panel"><h2>העלאת מדיה</h2><form id="uploadForm" class="form-grid"><select name="day_id" id="daySelect" required></select><select name="kind"><option value="image">תמונה</option><option value="video">סרטון</option><option value="audio">שיר</option></select><input name="title" placeholder="כותרת"><input name="file" type="file" required><button>העלה</button></form><progress id="progress" max="100" value="0"></progress><p id="uploadStatus"></p></section>
<section class="panel"><h2>המדיה האחרונה</h2><div id="adminMedia" class="admin-media"></div></section></div></main><script src="/assets/js/admin.js" defer></script></body></html>
